name: Static Site Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          test -f index.html
          test -f README.md
          echo "Repository looks like a static HTML project."

      - name: Run Fortify security scan
        if: ${{ secrets.FOD_TENANT != '' && secrets.FOD_USER != '' && secrets.FOD_PAT != '' }}
        uses: fortify/github-action@ef5539bf4bd9c45c0bd971978f635a69eae55297
        with:
          sast-scan: true
          debricked-sca-scan: true
        env:
          FOD_URL: https://ams.fortify.com
          FOD_TENANT: ${{ secrets.FOD_TENANT }}
          FOD_USER: ${{ secrets.FOD_USER }}
          FOD_PASSWORD: ${{ secrets.FOD_PAT }}
          SC_SAST_SENSOR_VERSION: 24.4.0

      - name: Skip Fortify when FoD credentials are missing
        if: ${{ secrets.FOD_TENANT == '' || secrets.FOD_USER == '' || secrets.FOD_PAT == '' }}
        run: |
          echo "Fortify scan skipped because FOD_TENANT, FOD_USER, and FOD_PAT must all be configured."
          echo "Add the required GitHub Actions secrets and rerun the workflow."
